name: Pobierz gazetki

on:
  schedule:
    # czas UTC: 05:20 i 16:20 = ok. 7:20 i 18:20 w Polsce
    - cron: "20 5,16 * * *"
  workflow_dispatch: {}   # ręczne uruchomienie: zakładka Actions → Run workflow

permissions:
  contents: write

concurrency:
  group: gazetki
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalacja
        run: pip install -r requirements.txt

      - name: Pobranie gazetek i budowa Excela
        run: python scraper.py

      - name: Zapis historii (CSV) w repozytorium
        run: |
          git config user.name  "gazetki-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Brak zmian w danych."
          else
            git commit -q -m "Dane $(TZ=Europe/Warsaw date '+%Y-%m-%d %H:%M')"
            git pull -q --rebase
            git push -q
          fi

      - name: Publikacja Excela (gałąź 'excel', zawsze 1 commit)
        run: |
          cp README.md out/README.md
          cd out
          git init -q -b excel
          git config user.name  "gazetki-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f gazetki.xlsx README.md
          git commit -q -m "Excel $(TZ=Europe/Warsaw date '+%Y-%m-%d %H:%M')"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" excel
